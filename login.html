<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
    rel="stylesheet"
    href="css/style.css"
    >

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

</head>
<body>

    <nav>

        <div class="logo">
            El Rincón del Carmen
        </div>

        <div class="nav-links">

            <a href="index.html">
                Inicio
            </a>

            <a href="register.html">
                Registro
            </a>

        </div>

    </nav>

    <div class="form-container">

        <form id="loginForm">

            <h2>Iniciar sesión</h2>

            <input
            type="email"
            id="email"
            placeholder="Correo"
            required
            >

            <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
            >

            <button type="submit">
                Ingresar
            </button>

        </form>

    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
